<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-label="Gately — 一站式網路閘道 開源透明，開箱即用">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(62,209,174,.07)"/></pattern>
    <radialGradient id="g1" cx="12%" cy="0%" r="60%"><stop offset="0" stop-color="#3ed1ae" stop-opacity=".28"/><stop offset="1" stop-color="#3ed1ae" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="82%" cy="55%" r="45%"><stop offset="0" stop-color="#818cf8" stop-opacity=".2"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#3ed1ae" stop-opacity=".5"/><stop offset="1" stop-color="#3ed1ae" stop-opacity="0"/></radialGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18a888"/><stop offset="1" stop-color="#0b5f4f"/></linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5eead4"/><stop offset=".55" stop-color="#3ed1ae"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="gm"><rect width="1280" height="430" fill="url(#fade)"/></mask>
    <clipPath id="clip"><rect width="1280" height="430" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">

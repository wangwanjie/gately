    <text x="170" y="121" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" font-size="60" font-weight="800" fill="#f2fbf9" letter-spacing="-1.5">Gately</text>
    <text x="72" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#e6f2ef" letter-spacing="-0.5">一站式網路閘道</text>

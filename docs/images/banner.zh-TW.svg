    <text x="72" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" font-size="17" fill="#9fb8b2">DDNS · STUN 穿透 · 連接埠轉發 · 反向代理 · 憑證 · WAF · Tailscale · frp</text>
    <text x="72" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#3ed1ae">gately.cn</text>

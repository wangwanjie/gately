name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm 版本取自 web/package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 前端构建与类型检查
        run: cd web && pnpm install --frozen-lockfile && pnpm build
      - name: 前端单元测试
        run: cd web && pnpm test
      - name: 格式检查
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: 单元测试
        run: go test -race ./...
      - name: 交叉编译
        run: |
          for target in linux/amd64 linux/arm64 linux/arm linux/mipsle linux/mips linux/riscv64 windows/amd64 darwin/arm64 freebsd/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} GOMIPS=softfloat CGO_ENABLED=0 go build -o /dev/null ./cmd/gately
          done
      - name: OpenWrt 安装包冒烟测试（opkg / apk）
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o "$RUNNER_TEMP/gately" ./cmd/gately
          deploy/openwrt/smoke-test.sh "$RUNNER_TEMP/gately"
      - name: ACME 端到端测试（Pebble）
        run: |
          GOBIN=$RUNNER_TEMP/bin go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.1 github.com/letsencrypt/pebble/v2/cmd/pebble-challtestsrv@v2.10.1
          GATELY_PEBBLE_BIN=$RUNNER_TEMP/bin GATELY_PEBBLE_SRC=$(go env GOMODCACHE)/github.com/letsencrypt/pebble/v2@v2.10.1 \
            go test -count=1 -run TestPebbleEndToEnd ./internal/modules/ssl/

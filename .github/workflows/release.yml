name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  # cosign 无密钥签名与构建来源证明需要 OIDC 令牌
  id-token: write
  attestations: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    # 只构建并上传 artifact，不需要写权限
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 构建前端
        run: cd web && pnpm install --frozen-lockfile && pnpm build
      - name: 交叉编译
        run: |
          mkdir -p dist
          cp LICENSE README.md dist/
          LDFLAGS="-s -w -X github.com/wangwanjie/gately/internal/version.Version=${GITHUB_REF_NAME} -X github.com/wangwanjie/gately/internal/version.Commit=${GITHUB_SHA::7} -X github.com/wangwanjie/gately/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for target in linux/amd64 linux/arm64 linux/arm linux/mipsle linux/mips linux/riscv64 windows/amd64 darwin/amd64 darwin/arm64 freebsd/amd64; do
            os=${target%/*}; arch=${target#*/}
            out=gately_${GITHUB_REF_NAME}_${os}_${arch}
            ext=""; [ "$os" = windows ] && ext=".exe"
            # mips 路由器大多没有硬件浮点，使用软浮点以免运行时报非法指令
            GOOS=$os GOARCH=$arch GOMIPS=softfloat CGO_ENABLED=0 go build -trimpath -ldflags "$LDFLAGS" -o dist/gately$ext ./cmd/gately
            # 飞牛 fpk 与 OpenWrt 安装包需要裸二进制，先留一份
            if [ "$os" = linux ]; then
              mkdir -p "$RUNNER_TEMP/linux-bin/$arch" && cp dist/gately "$RUNNER_TEMP/linux-bin/$arch/gately"
            fi
            (cd dist && tar czf $out.tar.gz gately$ext LICENSE README.md && rm gately$ext)
          done
          rm dist/LICENSE dist/README.md
      - name: 打包飞牛 fnOS 离线安装包（.fpk）
        run: |
          # 固定版本并校验哈希，避免下载被替换
          curl -fsSL -o fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          echo "54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93  fnpack" | sha256sum -c -
          sudo install -m 0755 fnpack /usr/local/bin/fnpack
          deploy/fnos/build.sh "$GITHUB_REF_NAME" x86 "$RUNNER_TEMP/linux-bin/amd64/gately" dist
          deploy/fnos/build.sh "$GITHUB_REF_NAME" arm "$RUNNER_TEMP/linux-bin/arm64/gately" dist
      - name: 打包 OpenWrt 安装包与 LuCI 插件（.ipk / .apk）
        run: |
          # 在固定摘要的 Alpine 容器中以 root 打包，使用其自带的 apk-tools v3 生成 OpenWrt 25.12 的 apk 包
          docker run --rm -v "$PWD:/w" -v "$RUNNER_TEMP/linux-bin:/bin-in:ro" -w /w \
            alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6 \
            sh -ec 'for arch in amd64 arm64 arm mipsle mips riscv64; do deploy/openwrt/build.sh "$1" "$arch" "/bin-in/$arch/gately" dist; done; deploy/openwrt/build-luci.sh "$1" dist' sh "$GITHUB_REF_NAME"
          sudo chown -R "$(id -u):$(id -g)" dist
      - name: 生成 SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/gately_${{ github.ref_name }}_sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: 上传未签名产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-unsigned
          path: dist/
          retention-days: 3

  # 用 Developer ID 证书签名 macOS 二进制并提交 Apple 公证，用户下载后 Gatekeeper 直接放行。
  # 需要仓库 Secrets：MACOS_CERT_P12（Developer ID Application 证书 p12 的 base64）、MACOS_CERT_PASSWORD、
  # APPLE_ID、APPLE_APP_PASSWORD（Apple ID 的 App 专用密码）、APPLE_TEAM_ID；未配置证书时跳过签名，原样发布
  sign-macos:
    needs: binaries
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-unsigned
          path: dist
      # 证书导入或公证失败（证书过期、Apple 服务故障、排队超时等）时不阻断发版：
      # 两步都 continue-on-error，失败时 dist 中仍是未签名的原压缩包，照常上传并发布，同时留下警告
      - name: 导入签名证书
        id: import
        if: env.MACOS_CERT_P12 != ''
        continue-on-error: true
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPASS=$(openssl rand -hex 16)
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          # 允许 codesign 无交互使用私钥
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "证书中没有 Developer ID Application 身份" >&2
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: 签名并公证
        id: sign
        if: steps.import.outcome == 'success'
        continue-on-error: true
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          work="$RUNNER_TEMP/macos"
          mkdir -p "$work/notarize"
          for tgz in dist/gately_*_darwin_*.tar.gz; do
            name=$(basename "$tgz" .tar.gz)
            mkdir -p "$work/$name"
            tar xzf "$tgz" -C "$work/$name"
            # 开启 hardened runtime 并带可信时间戳，这是公证的前提
            codesign --force --options runtime --timestamp --identifier cn.gately.gately --sign "$SIGN_IDENTITY" "$work/$name/gately"
            codesign --verify --strict --verbose=2 "$work/$name/gately"
            cp "$work/$name/gately" "$work/notarize/$name"
          done
          # 两个架构放进同一个 zip 一次提交公证，节省排队时间
          ditto -c -k --keepParent "$work/notarize" "$work/notarize.zip"
          # 公证结果为 Invalid 时 notarytool 以非零码退出，这里不让脚本立即终止，交给下面按 status 判断并打印公证日志
          xcrun notarytool submit "$work/notarize.zip" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m --output-format json > "$work/result.json" || true
          cat "$work/result.json"
          status=$(plutil -extract status raw "$work/result.json" || echo unknown)
          if [ "$status" != "Accepted" ]; then
            id=$(plutil -extract id raw "$work/result.json" || true)
            [ -n "$id" ] && xcrun notarytool log "$id" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID"
            exit 1
          fi
          # 命令行二进制无法装订公证票据，Gatekeeper 首次运行时在线查询；用重新打包后的文件替换原压缩包
          for tgz in dist/gately_*_darwin_*.tar.gz; do
            name=$(basename "$tgz" .tar.gz)
            (cd "$work/$name" && COPYFILE_DISABLE=1 tar --no-xattrs -czf "$GITHUB_WORKSPACE/$tgz" gately LICENSE README.md)
          done
      - name: 签名失败时发布未签名的 macOS 产物
        if: steps.import.outcome == 'failure' || steps.sign.outcome == 'failure'
        run: echo "::warning title=macOS 未签名::macOS 签名或公证失败，本次 Release 中的 darwin 压缩包未签名，请查看上面的步骤日志"
      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/gately_*_darwin_*.tar.gz
          retention-days: 3
      - name: 清理钥匙串
        if: always() && env.MACOS_CERT_P12 != ''
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  publish:
    needs: sign-macos
    runs-on: ubuntu-latest
    env:
      # Windows 代码签名证书，未配置时跳过；使用 jsign 签名，支持的证书存储类型见 https://ebourg.github.io/jsign/
      # WINDOWS_SIGN_STORETYPE：PKCS12、SIGNPATH（SignPath，开源项目可免费申请）、TRUSTEDSIGNING（Azure Trusted Signing）、AZUREKEYVAULT 等
      # WINDOWS_SIGN_KEYSTORE：PKCS12 时为证书文件的 base64，云服务时为服务地址或密钥库名称
      # WINDOWS_SIGN_STOREPASS：证书密码或云服务访问令牌；WINDOWS_SIGN_ALIAS：证书别名（PKCS12 单证书可留空）
      # WINDOWS_SIGN_CERTFILE：云服务需要单独提供证书链时填 PEM 内容，可留空
      WINDOWS_SIGN_STORETYPE: ${{ secrets.WINDOWS_SIGN_STORETYPE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-unsigned
          path: dist
      - name: 替换为已签名的 macOS 产物
        uses: actions/download-artifact@v4
        with:
          name: dist-macos
          path: dist
      - name: 签名 Windows 二进制
        if: env.WINDOWS_SIGN_STORETYPE != ''
        env:
          WINDOWS_SIGN_KEYSTORE: ${{ secrets.WINDOWS_SIGN_KEYSTORE }}
          WINDOWS_SIGN_STOREPASS: ${{ secrets.WINDOWS_SIGN_STOREPASS }}
          WINDOWS_SIGN_ALIAS: ${{ secrets.WINDOWS_SIGN_ALIAS }}
          WINDOWS_SIGN_CERTFILE: ${{ secrets.WINDOWS_SIGN_CERTFILE }}
        run: |
          # 固定版本并校验哈希，避免下载被替换
          curl -fsSL -o "$RUNNER_TEMP/jsign.jar" https://github.com/ebourg/jsign/releases/download/7.6/jsign-7.6.jar
          echo "6cf58aa080e7ff82656f320cff8d4a3bff30408df8766806dcba3740dd839fa5  $RUNNER_TEMP/jsign.jar" | sha256sum -c -
          keystore="$WINDOWS_SIGN_KEYSTORE"
          if [ "$WINDOWS_SIGN_STORETYPE" = PKCS12 ]; then
            echo "$WINDOWS_SIGN_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/win.p12"
            keystore="$RUNNER_TEMP/win.p12"
          fi
          args=(--storetype "$WINDOWS_SIGN_STORETYPE" --keystore "$keystore" --storepass "$WINDOWS_SIGN_STOREPASS"
            --tsaurl http://timestamp.digicert.com,http://timestamp.sectigo.com --alg SHA-256
            --name Gately --url https://gately.cn)
          if [ -n "$WINDOWS_SIGN_ALIAS" ]; then
            args+=(--alias "$WINDOWS_SIGN_ALIAS")
          fi
          if [ -n "$WINDOWS_SIGN_CERTFILE" ]; then
            printf '%s\n' "$WINDOWS_SIGN_CERTFILE" > "$RUNNER_TEMP/win-chain.pem"
            args+=(--certfile "$RUNNER_TEMP/win-chain.pem")
          fi
          for tgz in dist/gately_*_windows_*.tar.gz; do
            work=$(mktemp -d)
            tar xzf "$tgz" -C "$work"
            java -jar "$RUNNER_TEMP/jsign.jar" "${args[@]}" "$work/gately.exe"
            (cd "$work" && tar czf "$GITHUB_WORKSPACE/$tgz" gately.exe LICENSE README.md)
          done
          rm -f "$RUNNER_TEMP/win.p12" "$RUNNER_TEMP/win-chain.pem"
      - name: 生成校验和
        run: cd dist && sha256sum *.tar.gz *.fpk *.ipk *.apk > checksums.txt
      - uses: sigstore/cosign-installer@v3
      - name: 签名校验和文件（cosign 无密钥）
        run: |
          cd dist
          cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt
      - name: 生成构建来源证明
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.fpk
            dist/*.ipk
            dist/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  image:
    runs-on: ubuntu-latest
    env:
      # 仓库配置了 DOCKERHUB_USERNAME 与 DOCKERHUB_TOKEN（Docker Hub 访问令牌，需 Read & Write 权限）时，
      # 镜像同时推送到 Docker Hub 的 <用户名>/gately（官方为 vanjayak/gately），与 GHCR 使用同一份多架构清单与签名；未配置时只推送 GHCR
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 登录 Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 生成镜像标签
        id: tags
        run: |
          {
            echo "list<<EOF"
            echo "ghcr.io/${{ github.repository_owner }}/gately:${{ github.ref_name }}"
            echo "ghcr.io/${{ github.repository_owner }}/gately:latest"
            if [ -n "$DOCKERHUB_USERNAME" ]; then
              echo "docker.io/$DOCKERHUB_USERNAME/gately:${{ github.ref_name }}"
              echo "docker.io/$DOCKERHUB_USERNAME/gately:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v3
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          # 在镜像仓库中附带 SBOM 与构建来源证明
          sbom: true
          provenance: mode=max
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: ${{ steps.tags.outputs.list }}
      - name: 签名镜像（cosign 无密钥）
        run: |
          cosign sign --yes ghcr.io/${{ github.repository_owner }}/gately@${{ steps.push.outputs.digest }}
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            cosign sign --yes "docker.io/$DOCKERHUB_USERNAME/gately@${{ steps.push.outputs.digest }}"
          fi

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  # cosign 无密钥签名与构建来源证明需要 OIDC 令牌
  id-token: write
  attestations: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 构建前端
        run: cd web && pnpm install --frozen-lockfile && pnpm build
      - name: 交叉编译
        run: |
          mkdir -p dist
          cp LICENSE README.md dist/
          LDFLAGS="-s -w -X github.com/wangwanjie/gately/internal/version.Version=${GITHUB_REF_NAME} -X github.com/wangwanjie/gately/internal/version.Commit=${GITHUB_SHA::7} -X github.com/wangwanjie/gately/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for target in linux/amd64 linux/arm64 linux/arm linux/mipsle linux/mips linux/riscv64 windows/amd64 darwin/amd64 darwin/arm64 freebsd/amd64; do
            os=${target%/*}; arch=${target#*/}
            out=gately_${GITHUB_REF_NAME}_${os}_${arch}
            ext=""; [ "$os" = windows ] && ext=".exe"
            # mips 路由器大多没有硬件浮点，使用软浮点以免运行时报非法指令
            GOOS=$os GOARCH=$arch GOMIPS=softfloat CGO_ENABLED=0 go build -trimpath -ldflags "$LDFLAGS" -o dist/gately$ext ./cmd/gately
            # 飞牛 fpk 与 OpenWrt 安装包需要裸二进制，先留一份
            if [ "$os" = linux ]; then
              mkdir -p "$RUNNER_TEMP/linux-bin/$arch" && cp dist/gately "$RUNNER_TEMP/linux-bin/$arch/gately"
            fi
            (cd dist && tar czf $out.tar.gz gately$ext LICENSE README.md && rm gately$ext)
          done
          rm dist/LICENSE dist/README.md
      - name: 打包飞牛 fnOS 离线安装包（.fpk）
        run: |
          # 固定版本并校验哈希，避免下载被替换
          curl -fsSL -o fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          echo "54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93  fnpack" | sha256sum -c -
          sudo install -m 0755 fnpack /usr/local/bin/fnpack
          deploy/fnos/build.sh "$GITHUB_REF_NAME" x86 "$RUNNER_TEMP/linux-bin/amd64/gately" dist
          deploy/fnos/build.sh "$GITHUB_REF_NAME" arm "$RUNNER_TEMP/linux-bin/arm64/gately" dist
      - name: 打包 OpenWrt 安装包与 LuCI 插件（.ipk / .apk）
        run: |
          # 在固定摘要的 Alpine 容器中以 root 打包，使用其自带的 apk-tools v3 生成 OpenWrt 25.12 的 apk 包
          docker run --rm -v "$PWD:/w" -v "$RUNNER_TEMP/linux-bin:/bin-in:ro" -w /w \
            alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6 \
            sh -ec 'for arch in amd64 arm64 arm mipsle mips riscv64; do deploy/openwrt/build.sh "$1" "$arch" "/bin-in/$arch/gately" dist; done; deploy/openwrt/build-luci.sh "$1" dist' sh "$GITHUB_REF_NAME"
          sudo chown -R "$(id -u):$(id -g)" dist
      - name: 生成校验和
        run: cd dist && sha256sum *.tar.gz *.fpk *.ipk *.apk > checksums.txt
      - name: 生成 SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/gately_${{ github.ref_name }}_sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: sigstore/cosign-installer@v3
      - name: 签名校验和文件（cosign 无密钥）
        run: |
          cd dist
          cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt
      - name: 生成构建来源证明
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.fpk
            dist/*.ipk
            dist/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  image:
    runs-on: ubuntu-latest
    env:
      # 仓库配置了 DOCKERHUB_USERNAME 与 DOCKERHUB_TOKEN（Docker Hub 访问令牌，需 Read & Write 权限）时，
      # 镜像同时推送到 Docker Hub 的 <用户名>/gately（官方为 vanjayak/gately），与 GHCR 使用同一份多架构清单与签名；未配置时只推送 GHCR
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 登录 Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 生成镜像标签
        id: tags
        run: |
          {
            echo "list<<EOF"
            echo "ghcr.io/${{ github.repository_owner }}/gately:${{ github.ref_name }}"
            echo "ghcr.io/${{ github.repository_owner }}/gately:latest"
            if [ -n "$DOCKERHUB_USERNAME" ]; then
              echo "docker.io/$DOCKERHUB_USERNAME/gately:${{ github.ref_name }}"
              echo "docker.io/$DOCKERHUB_USERNAME/gately:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v3
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          # 在镜像仓库中附带 SBOM 与构建来源证明
          sbom: true
          provenance: mode=max
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: ${{ steps.tags.outputs.list }}
      - name: 签名镜像（cosign 无密钥）
        run: |
          cosign sign --yes ghcr.io/${{ github.repository_owner }}/gately@${{ steps.push.outputs.digest }}
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            cosign sign --yes "docker.io/$DOCKERHUB_USERNAME/gately@${{ steps.push.outputs.digest }}"
          fi

# 压测后端（源站）：固定在 vCPU 2,3，各被测代理都反代到这里
worker_processes 2;
worker_rlimit_nofile 200000;
events { worker_connections 65535; multi_accept on; }
http {
  access_log off;
  sendfile on;
  tcp_nopush on;
  keepalive_requests 1000000;
  keepalive_timeout 120s;
  server {
    listen 127.0.0.1:9000 reuseport backlog=65535;
    # 路由器测试时由路由器经局域网访问源站
    listen 9001 reuseport backlog=65535;
    root /srv/bench;
    location = / { default_type text/plain; try_files /1k.txt =404; }
    # DDNS 测试用：/ip 返回固定公网地址，/cb 记录回调以便计数
    location = /ip { default_type text/plain; return 200 "203.0.113.7"; }
    location = /cb { access_log /tmp/cb.log; default_type text/plain; return 200 "ok"; }
    location / { }
  }
}

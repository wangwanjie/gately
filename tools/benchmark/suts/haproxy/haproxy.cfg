global
  nbthread 2
  maxconn 100000
  ssl-default-bind-options ssl-min-ver TLSv1.2
defaults
  mode http
  timeout connect 5s
  timeout client 60s
  timeout server 60s
  option forwardfor
frontend fe
  bind :8080
  bind :8443 ssl crt /certs/bench.pem alpn h2,http/1.1
  default_backend be
backend be
  server s1 127.0.0.1:9000

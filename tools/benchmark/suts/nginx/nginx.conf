# nginx 反代：2 个 worker、到源站开 keepalive 连接池（常规调优写法）
worker_processes 2;
worker_rlimit_nofile 200000;
events { worker_connections 12000; }
http {
  access_log off;
  keepalive_requests 1000000;
  upstream be { server 127.0.0.1:9000; keepalive 64; }
  server {
    listen 8080;
    listen 8443 ssl;
    http2 on;
    server_name bench.test;
    ssl_certificate /certs/bench.crt;
    ssl_certificate_key /certs/bench.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
      proxy_pass http://be;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}

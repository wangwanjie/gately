# 敲门专项的受保护源站（容器 knock-origin，vCPU 2,3）：监听全部地址的 9100 端口（即受保护端口），
# / 返回 1024 字节，与公共源站 backend 的响应一致。文件由 bench.py 生成在 /tmp/knock-origin。
worker_processes 2;
worker_rlimit_nofile 200000;
events { worker_connections 65535; multi_accept on; }
http {
  access_log off;
  sendfile on;
  keepalive_requests 1000000;
  keepalive_timeout 120s;
  server {
    listen 9100 reuseport backlog=65535;
    root /srv/knock;
    location = / { default_type text/plain; try_files /1k.txt =404; }
  }
}

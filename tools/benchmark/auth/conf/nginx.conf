# nginx 1.29 认证网关：与 suts/nginx 相同的常规调优（2 个 worker、到源站的 keepalive 连接池），按端口区分认证方式
#   8443  bench.test       auth_request + Authelia（到 Authelia 走 keepalive 连接池，常规调优写法）
#   8443  auth.bench.test  Authelia 门户（登录接口 /api/firstfactor）
#   8444  bench.test       不加认证（同一进程的对照组）
#   8445  bench.test       auth_basic，htpasswd 为 bcrypt（cost 10，与 Gately 相同）
#   8446  bench.test       auth_basic，htpasswd 为 apr1（Apache MD5，1000 轮）
#   8447  bench.test       auth_request + Authelia，按 Authelia 官方片段直接 proxy_pass URL（不走连接池，每个子请求新建连接）
# @BACKEND@ 由 bench.py 替换为源站地址
worker_processes 2;
worker_rlimit_nofile 200000;
events { worker_connections 12000; }
http {
  access_log off;
  keepalive_requests 1000000;
  ssl_certificate /certs/bench.crt;
  ssl_certificate_key /certs/bench.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  http2 on;

  upstream be { server @BACKEND@; keepalive 64; }
  upstream authelia { server 127.0.0.1:9091; keepalive 64; }

  # Authelia 门户：反代到 9091，传递原始访问地址
  server {
    listen 8443 ssl;
    server_name auth.bench.test;
    location / {
      proxy_pass http://authelia;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-URI $request_uri;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  # 受保护站点：每个请求先以子请求问 Authelia（/api/authz/auth-request），200 放行，401 跳转门户
  server {
    listen 8443 ssl;
    server_name bench.test;
    location /internal/authelia/authz {
      internal;
      proxy_pass http://authelia/api/authz/auth-request;
      proxy_set_header X-Original-Method $request_method;
      proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Content-Length "";
      proxy_set_header Connection "";
      proxy_pass_request_body off;
      proxy_http_version 1.1;
      proxy_cache_bypass $cookie_session;
      proxy_no_cache $cookie_session;
      proxy_buffers 4 32k;
      client_body_buffer_size 128k;
    }
    location / {
      auth_request /internal/authelia/authz;
      auth_request_set $user $upstream_http_remote_user;
      auth_request_set $groups $upstream_http_remote_groups;
      auth_request_set $name $upstream_http_remote_name;
      auth_request_set $email $upstream_http_remote_email;
      auth_request_set $redirection_url $upstream_http_location;
      error_page 401 =302 $redirection_url;
      proxy_set_header Remote-User $user;
      proxy_set_header Remote-Groups $groups;
      proxy_set_header Remote-Name $name;
      proxy_set_header Remote-Email $email;
      proxy_pass http://be;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # 对照组：同一 nginx 进程不加认证
  server {
    listen 8444 ssl;
    server_name bench.test;
    location / {
      proxy_pass http://be;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # 基本认证：bcrypt。nginx 每个请求都调用 crypt() 校验，不缓存结果
  server {
    listen 8445 ssl;
    server_name bench.test;
    location / {
      auth_basic "bench";
      auth_basic_user_file /work/htpasswd.bcrypt;
      proxy_pass http://be;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # 基本认证：apr1
  server {
    listen 8446 ssl;
    server_name bench.test;
    location / {
      auth_basic "bench";
      auth_basic_user_file /work/htpasswd.apr1;
      proxy_pass http://be;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # Authelia 官方片段写法：auth-location.conf 中 proxy_pass 直接写 URL，没有 upstream keepalive，
  # nginx 对每个子请求新建一条到 Authelia 的 TCP 连接
  server {
    listen 8447 ssl;
    server_name bench.test;
    location /internal/authelia/authz {
      internal;
      proxy_pass http://127.0.0.1:9091/api/authz/auth-request;
      proxy_set_header X-Original-Method $request_method;
      proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Content-Length "";
      proxy_set_header Connection "";
      proxy_pass_request_body off;
      proxy_http_version 1.1;
      proxy_cache_bypass $cookie_session;
      proxy_no_cache $cookie_session;
      proxy_buffers 4 32k;
      client_body_buffer_size 128k;
    }
    location / {
      auth_request /internal/authelia/authz;
      auth_request_set $user $upstream_http_remote_user;
      auth_request_set $redirection_url $upstream_http_location;
      error_page 401 =302 $redirection_url;
      proxy_set_header Remote-User $user;
      proxy_pass http://be;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}

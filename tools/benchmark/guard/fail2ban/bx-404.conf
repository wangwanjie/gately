# 压测专用过滤器：nginx combined 格式访问日志中状态码为 404 的请求。
# 与 Gately 规则使用同一条正则语义（来源地址开头、请求行、状态码 404），时间戳由 fail2ban 自己解析后去掉，故写成 \[\]。
[Definition]
failregex = ^<HOST> \S+ \S+ \[\] "[A-Z]+ [^"]*" 404\s
ignoreregex =
# 只按 nginx 的时间格式解析，避免逐条尝试默认模板（与 fail2ban 自带 nginx 过滤器的做法一致）
datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}

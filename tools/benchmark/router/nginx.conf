# 路由器上的 nginx：与压测机上的调优写法一致，worker 数等于 vCPU 数
worker_processes 2;
worker_rlimit_nofile 65535;
events { worker_connections 12000; }
http {
  access_log off;
  keepalive_requests 1000000;
  upstream be { server BACKEND; keepalive 64; }
  server {
    listen 8080;
    listen 8443 ssl;
    http2 on;
    server_name r.bench.test;
    ssl_certificate /root/bench/bench.crt;
    ssl_certificate_key /root/bench/bench.key;
    location / {
      proxy_pass http://be;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}

# Gately 部署示例。根据需要调整挂载目录。
services:
  gately:
    image: ghcr.io/wangwanjie/gately:latest
    container_name: gately
    restart: unless-stopped
    # 端口转发、STUN 穿透、Web 服务都需要直接监听宿主机端口
    network_mode: host
    # 入侵防护把封禁写入宿主机防火墙：nftables，内核没有 nf_tables（如群晖）时用 iptables + ipset（不需要可删除，封禁仍对 Gately 自身的服务生效）
    cap_add:
      - NET_ADMIN
    volumes:
      # 配置目录（明文 JSON，可纳入 git 备份；ssl.json 中含证书私钥）
      - ./data:/etc/gately
      # Docker 管理（不需要可删除）
      - /var/run/docker.sock:/var/run/docker.sock
      # 从 Lucky 迁移时，脚本与证书映射目录挂载到与原环境相同的路径
      # - ./custom:/etc/lucky/custom
      # - ../nginx/config/ssl/lucky:/data/nginx/config/ssl/lucky
    environment:
      - TZ=Asia/Shanghai

# 演示实例前置的 Cookie 改名代理，用法见 README.md「前置是 Gately 时的 Cookie 改名」。
#
# v0.6.8.1 及更早的 Gately 反代到非本机后台的后端时，会剥离所有名为 gately_token 的 Cookie，
# 演示实例签发的会话因此到不了演示实例，一键进入后每个请求都是 401。
# 这里把浏览器一侧的会话 Cookie 改名为 gately_demo_token：响应中的 Set-Cookie 改名下发，请求时再改回 gately_token 交给演示实例。

# 请求：带 gately_demo_token 时把它作为 gately_token 放在最前面（Go 取同名 Cookie 的第一个），其余 Cookie 原样保留
map $cookie_gately_demo_token $demo_upstream_cookie {
    ""      $http_cookie;
    default "gately_token=$cookie_gately_demo_token; $http_cookie";
}

# 响应：演示实例下发的 gately_token（登录与登出）改名为 gately_demo_token。
# $upstream_http_set_cookie 只取第一条 Set-Cookie，演示实例的响应最多只有一条
map $upstream_http_set_cookie $demo_set_cookie {
    "~^gately_token=(?<rest>.*)$" "gately_demo_token=$rest";
    default $upstream_http_set_cookie;
}

# WebSocket 升级
map $http_upgrade $demo_connection {
    ""      "";
    default upgrade;
}

server {
    listen 8080;
    server_tokens off;
    # 经 Docker 内置 DNS 动态解析演示容器：容器重建换了地址也不必重启 nginx
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $demo_upstream http://gately-demo:16680;
    client_max_body_size 16m;

    location / {
        proxy_pass $demo_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $demo_connection;
        proxy_set_header Cookie $demo_upstream_cookie;
        # 实时日志等长连接接口按流输出
        proxy_buffering off;
        proxy_read_timeout 1h;

        proxy_hide_header Set-Cookie;
        add_header Set-Cookie $demo_set_cookie always;
    }
}

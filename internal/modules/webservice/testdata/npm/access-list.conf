# ------------------------------------------------------------
# lan.example.com
# ------------------------------------------------------------



map $scheme $hsts_header_plain {
    https   "max-age=63072000; preload";
}
map $scheme $hsts_header_subdomains {
    https   "max-age=63072000;includeSubDomains; preload";
}

server {
  set $forward_scheme http;
  set $server         "192.168.1.30";
  set $port           3000;

  listen 80;
listen [::]:80;


  server_name lan.example.com;
http2 off;






  # Block Exploits
  include conf.d/include/block-exploits.conf;






proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $http_connection;
proxy_http_version 1.1;


  access_log /data/logs/proxy-host-3_access.log proxy;
  error_log /data/logs/proxy-host-3_error.log warn;







  location / {


  
    

    
    # Access Rules: 1 total
    
    allow 192.168.0.0/16;
    
    deny all;
    

    # Access checks must...
    
    satisfy all;
    
  





    
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    

    # Proxy!
    include conf.d/include/proxy.conf;
  }


  # Custom
  include /data/nginx/custom/server_proxy[.]conf;
}

# ------------------------------------------------------------
# vault.example.com
# ------------------------------------------------------------



map $scheme $hsts_header_plain {
    https   "max-age=63072000; preload";
}
map $scheme $hsts_header_subdomains {
    https   "max-age=63072000;includeSubDomains; preload";
}

server {
  set $forward_scheme http;
  set $server         "192.168.1.40";
  set $port           8080;

  listen 80;
listen [::]:80;

listen 443 ssl;
listen [::]:443 ssl;


  server_name vault.example.com;

  http2 on;


  # Custom SSL
  ssl_certificate /data/custom_ssl/npm-1/fullchain.pem;
  ssl_certificate_key /data/custom_ssl/npm-1/privkey.pem;








  # HSTS (ngx_http_headers_module is required) (63072000 seconds = 2 years)

  add_header Strict-Transport-Security $hsts_header_plain always;






    # Force SSL
    
    set $trust_forwarded_proto "F";
    
    include conf.d/include/force-ssl.conf;




proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $http_connection;
proxy_http_version 1.1;


  access_log /data/logs/proxy-host-4_access.log proxy;
  error_log /data/logs/proxy-host-4_error.log warn;







  location / {


  
    
    # Authorization
    auth_basic            "Authorization required";
    auth_basic_user_file  /data/access/3;

    

    

    

    # Access checks must...
    
    satisfy all;
    
  




  # HSTS (ngx_http_headers_module is required) (63072000 seconds = 2 years)

  add_header Strict-Transport-Security $hsts_header_plain always;






    
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    

    # Proxy!
    include conf.d/include/proxy.conf;
  }


  # Custom
  include /data/nginx/custom/server_proxy[.]conf;
}

# ------------------------------------------------------------
# family.example.com
# ------------------------------------------------------------



map $scheme $hsts_header_plain {
    https   "max-age=63072000; preload";
}
map $scheme $hsts_header_subdomains {
    https   "max-age=63072000;includeSubDomains; preload";
}

server {
  set $forward_scheme http;
  set $server         "192.168.1.50";
  set $port           8096;

  listen 80;
listen [::]:80;


  server_name family.example.com;
http2 off;











proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $http_connection;
proxy_http_version 1.1;


  access_log /data/logs/proxy-host-5_access.log proxy;
  error_log /data/logs/proxy-host-5_error.log warn;







  location / {


  
    
    # Authorization
    auth_basic            "Authorization required";
    auth_basic_user_file  /data/access/1;

    
    proxy_set_header Authorization "";
    

    

    
    # Access Rules: 2 total
    
    allow 192.168.1.0/24;
    
    deny 10.8.0.5;
    
    deny all;
    

    # Access checks must...
    
    satisfy any;
    
  





    
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    

    # Proxy!
    include conf.d/include/proxy.conf;
  }


  # Custom
  include /data/nginx/custom/server_proxy[.]conf;
}


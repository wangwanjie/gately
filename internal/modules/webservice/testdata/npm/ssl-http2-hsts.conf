# ------------------------------------------------------------
# nas.example.com
# ------------------------------------------------------------



map $scheme $hsts_header_plain {
    https   "max-age=63072000; preload";
}
map $scheme $hsts_header_subdomains {
    https   "max-age=63072000;includeSubDomains; preload";
}

server {
  set $forward_scheme http;
  set $server         "192.168.1.10";
  set $port           5000;

  listen 80;
listen [::]:80;

listen 443 ssl;
listen [::]:443 ssl;


  server_name nas.example.com;

  http2 on;


  # Let's Encrypt SSL
  include conf.d/include/letsencrypt-acme-challenge.conf;
  include conf.d/include/ssl-cache.conf;
  include conf.d/include/ssl-ciphers.conf;
  ssl_certificate /etc/letsencrypt/live/npm-2/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/npm-2/privkey.pem;




# Asset Caching
  include conf.d/include/assets.conf;


  # Block Exploits
  include conf.d/include/block-exploits.conf;



  # HSTS (ngx_http_headers_module is required) (63072000 seconds = 2 years)

  add_header Strict-Transport-Security $hsts_header_subdomains always;






    # Force SSL
    
    set $trust_forwarded_proto "F";
    
    include conf.d/include/force-ssl.conf;




proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $http_connection;
proxy_http_version 1.1;


  access_log /data/logs/proxy-host-1_access.log proxy;
  error_log /data/logs/proxy-host-1_error.log warn;







  location / {





  # HSTS (ngx_http_headers_module is required) (63072000 seconds = 2 years)

  add_header Strict-Transport-Security $hsts_header_subdomains always;






    
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    

    # Proxy!
    include conf.d/include/proxy.conf;
  }


  # Custom
  include /data/nginx/custom/server_proxy[.]conf;
}

# ------------------------------------------------------------
# old.example.com
# ------------------------------------------------------------



map $scheme $hsts_header_plain {
    https   "max-age=63072000; preload";
}
map $scheme $hsts_header_subdomains {
    https   "max-age=63072000;includeSubDomains; preload";
}

server {
  listen 80;
listen [::]:80;

listen 443 ssl;
listen [::]:443 ssl;


  server_name old.example.com;

  http2 on;


  # Let's Encrypt SSL
  include conf.d/include/letsencrypt-acme-challenge.conf;
  include conf.d/include/ssl-cache.conf;
  include conf.d/include/ssl-ciphers.conf;
  ssl_certificate /etc/letsencrypt/live/npm-2/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/npm-2/privkey.pem;








  # HSTS (ngx_http_headers_module is required) (63072000 seconds = 2 years)

  add_header Strict-Transport-Security $hsts_header_plain always;






    # Force SSL
    
    set $trust_forwarded_proto "F";
    
    include conf.d/include/force-ssl.conf;



  access_log /data/logs/redirection-host-1_access.log standard;
  error_log /data/logs/redirection-host-1_error.log warn;




  location / {


  # HSTS (ngx_http_headers_module is required) (63072000 seconds = 2 years)

  add_header Strict-Transport-Security $hsts_header_plain always;






    
        return 301 $scheme://nas.example.com$request_uri;
    
  }


  # Custom
  include /data/nginx/custom/server_redirect[.]conf;
}

